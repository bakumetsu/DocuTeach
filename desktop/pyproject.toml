[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["."]
exclude = [".venv"]
extraPaths = ["../backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../backend"]

[tool.ruff.lint.per-file-ignores]
"launcher.py" = ["BLE001", "S110"]
"build.py" = ["PLW1510"]
